<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Test</title>
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
        }
        
        /* Compact Footer Styles */
        .compact-footer {
            background: #0a0a0a;
            color: #ffffff;
            padding: 50px 0 30px;
            border-top: 1px solid #1a1a1a;
            font-family: 'Poppins', sans-serif;
        }
        
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .footer-column {
            min-width: 0;
        }
        
        .footer-heading {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .footer-link {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
            line-height: 1.5;
        }
        
        .footer-link:hover {
            color: #ffffff;
        }
        
        .footer-contact {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .contact-info {
            color: #b0b0b0;
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }
        
        .footer-social {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        .social-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a1a1a;
            color: #b0b0b0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 12px;
            text-align: center;
            line-height: 1;
        }
        
        .social-icon:hover {
            background: #2a2a2a;
            color: #ffffff;
            transform: translateY(-2px);
        }
        
        .footer-bottom {
            border-top: 1px solid #1a1a1a;
            padding-top: 20px;
            margin-top: 20px;
        }
        
        .footer-bottom-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .copyright {
            color: #808080;
            font-size: 13px;
            margin: 0;
        }
        
        .footer-legal {
            display: flex;
            gap: 20px;
        }
        
        .legal-link {
            color: #808080;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .legal-link:hover {
            color: #ffffff;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .footer-grid {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }
            
            .footer-social {
                justify-content: center;
            }
            
            .footer-bottom-content {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
            
            .footer-legal {
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .compact-footer {
                padding: 40px 0 25px;
            }
            
            .footer-container {
                padding: 0 15px;
            }
            
            .footer-heading {
                font-size: 15px;
                margin-bottom: 12px;
            }
            
            .footer-link {
                font-size: 13px;
            }
            
            .contact-info {
                font-size: 13px;
            }
            
            .social-icon {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <p>Footer Design Test - Scroll down to see the footer</p>
    </div>
    
    <!-- COMPACT FOOTER -->
    <footer class="compact-footer">
        <div class="footer-container">
            <div class="footer-grid">
                <!-- Company Column -->
                <div class="footer-column">
                    <h4 class="footer-heading">Company</h4>
                    <div class="footer-links">
                        <a href="#" class="footer-link">About Us</a>
                        <a href="#" class="footer-link">Contact</a>
                        <a href="#" class="footer-link">Careers</a>
                        <a href="#" class="footer-link">Press</a>
                    </div>
                </div>
                
                <!-- Quick Links Column -->
                <div class="footer-column">
                    <h4 class="footer-heading">Quick Links</h4>
                    <div class="footer-links">
                        <a href="#" class="footer-link">Dashboard</a>
                        <a href="#" class="footer-link">Events</a>
                        <a href="#" class="footer-link">Support</a>
                        <a href="#" class="footer-link">FAQ</a>
                    </div>
                </div>
                
                <!-- Contact Column -->
                <div class="footer-column">
                    <h4 class="footer-heading">Contact</h4>
                    <div class="footer-contact">
                        <p class="contact-info">info@eventrix.campus</p>
                        <p class="contact-info">+255 123 456 789</p>
                        <div class="footer-social">
                            <a href="#" class="social-icon" title="Facebook">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a href="#" class="social-icon" title="Twitter">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="#" class="social-icon" title="LinkedIn">
                                <i class="fab fa-linkedin-in"></i>
                            </a>
                            <a href="#" class="social-icon" title="Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Section -->
            <div class="footer-bottom">
                <div class="footer-bottom-content">
                    <p class="copyright">&copy; 2026 Eventrix Campus. All rights reserved.</p>
                    <div class="footer-legal">
                        <a href="#" class="legal-link">Privacy Policy</a>
                        <a href="#" class="legal-link">Terms of Service</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
