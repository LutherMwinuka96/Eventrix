<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - KIUT-Eventrix Campus</title>
  <meta http-equiv="refresh" content="0; url=app.html">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1b3d2b, #4a6b5a);
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      margin: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }
    p {
      margin: 0;
      opacity: 0.9;
      line-height: 1.6;
      font-size: 14px;
    }
    a {
      color: #ffd4a3;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirecting to Student Dashboard</h1>
    <p>
      The student dashboard now lives inside
      <a href="app.html">app.html</a>.
      If you are not redirected automatically, click the link above.
    </p>
  </div>
  <script>
    window.location.replace('app.html');
  </script>
</body>
</html>
